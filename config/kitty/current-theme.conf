# vim:ft=kitty

## name:     Warm Ember
## blurb:    Warm palette built around the Hyprland focus orange (#FF8000).
## backup:   original Catppuccin-Macchiato saved as current-theme.conf.backup

# The basic colors
foreground              #F2F0EB
selection_foreground    #1A0F05
selection_background    #FF8000

# Cursor colors
cursor                  #F2F0EB
cursor_text_color       #0A0A0A

# URL underline color when hovering with mouse
url_color               #FFA94D

# Kitty window border colors
active_border_color     #FF8000
inactive_border_color   #6E5443
bell_border_color       #FFCB5C

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #1A0F05
active_tab_background   #FF8000
inactive_tab_foreground #D9B08C
inactive_tab_background #2A1A0E
tab_bar_background      #1A0F05

# Colors for marks (marked text in the terminal)
mark1_foreground #1A0F05
mark1_background #FF8000
mark2_foreground #1A0F05
mark2_background #FFB627
mark3_foreground #1A0F05
mark3_background #FF8B7B

# The 16 terminal colors

# black
color0 #3B2A21
color8 #6E5443

# red
color1  #FF4B33
color9  #FF7355

# green -> olive
color2  #A8A13F
color10 #C7C055

# yellow -> amber
color3  #FFB627
color11 #FFCB5C

# blue -> bronze
color4  #C77B3A
color12 #E8A05E

# magenta -> salmon
color5  #FF8B7B
color13 #FFA79A

# cyan -> sand
color6  #D9B08C
color14 #EFCBA8

# white -> cream
color7  #F2F0EB
color15 #FAF9F6
