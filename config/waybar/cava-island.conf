# cava alimentando o equalizador da ilha da Waybar.
# Saida crua em ascii: uma linha por quadro, "n;n;n;n;n;".
[general]
mode = normal
framerate = 12
bars = 5
autosens = 1
overshoot = 0

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
channels = mono

[smoothing]
noise_reduction = 55
