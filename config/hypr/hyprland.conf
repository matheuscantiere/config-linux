################################################################################
#  Hyprland config — migrated to 0.53 syntax
#  Docs: https://wiki.hyprland.org/Configuring/
################################################################################

###############################
# MONITORS
###############################
# DP-1 and HDMI-A-1 are two identical Samsung S22F350 panels.
# To swap which physical screen is primary, swap these two names.
monitor = HDMI-A-1,1920x1080@60,0x0,1
monitor = DP-1,1920x1080@60,1920x0,1
monitor = eDP-1,1920x1080@60,3840x0,1
# Fallback for any monitor not listed above
monitor = ,preferred,auto,1

###############################
# WORKSPACES
###############################
workspace = 1,persistent:true,monitor:HDMI-A-1,default:true
workspace = 2,persistent:true,monitor:HDMI-A-1
workspace = 3,persistent:true,monitor:HDMI-A-1
workspace = 4,persistent:true,monitor:DP-1,default:true
workspace = 5,persistent:true,monitor:DP-1
workspace = 6,persistent:true,monitor:DP-1
workspace = 7,persistent:true,monitor:eDP-1,default:true

###############################
# VARIABLES
###############################
$mainMod     = SUPER
$terminal    = kitty
$fileManager = thunar
$menu        = vicinae toggle
$browser     = google-chrome-stable
$lock        = hyprlock
$scripts     = $HOME/.config/hypr/scripts

###############################
# ENVIRONMENT
###############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct   # change to qt6ct if you use Qt6

###############################
# AUTOSTART
###############################
# Export the live compositor env to systemd/D-Bus before any portal starts.
# Without HYPRLAND_INSTANCE_SIGNATURE a stale value from a previous session makes
# xdg-desktop-portal-hyprland attach to a dead socket, so screen sharing goes black.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user restart xdg-desktop-portal-hyprland.service xdg-desktop-portal.service
exec-once = hyprpm reload -n
exec-once = waybar
# hyprpolkitagent replaces the KDE agent, which is not installed on Ubuntu.
# The package ships this user unit; it is the supported way to launch it.
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = systemctl --user start vicinae.service
# hyprpaper 0.8.3 hangs during hyprtoolkit wayland init on Hyprland 0.53.3:
# it never reaches config parsing, so no wallpaper is ever drawn.
# exec-once = hyprpaper
exec-once = swaybg -i ~/.config/hypr/wallpaper.png -m fill
# exec-once = blueman-applet  # icone da tray duplicava o modulo bluetooth da waybar
exec-once = ~/.config/waybar/scripts/eq-driver.sh
# Painel residente: sobe escondido, so aparece no hover.
exec-once = env PANEL_HOVER=1 python3 ~/.config/waybar/scripts/player-panel.py
exec-once = ~/.config/waybar/scripts/island-hover.py

###############################
# INPUT
###############################
input {
    kb_layout   = br,us
    kb_variant  =
    kb_model    =
    # Sem grp:win_space_toggle: SUPER+SPACE agora abre o launcher.
    # A troca br/us vive no bind explicito $mainMod SHIFT, SPACE.
    kb_options  =
    kb_rules    =

    repeat_rate  = 125
    follow_mouse = 1
    sensitivity  = 0        # -1.0 to 1.0, 0 means no modification

    touchpad {
        natural_scroll = false
    }
}

# Per-device override example
# device {
#     name = 2.4g-4f-keyboard-&-mouse-1
#     kb_layout = br,us
#     kb_options = grp:win_space_toggle
# }

###############################
# GENERAL
###############################
general {
    gaps_in     = 5
    gaps_out    = 5
    border_size = 2

    # cor antiga (azul): col.active_border   = rgba(2281FDFF) rgba(FFFFFFEE) 35deg
    col.active_border   = rgba(FF8000FF) rgba(FFB347EE) 35deg
    col.inactive_border = rgba(777777AA)

    layout        = dwindle
    allow_tearing = false
}

###############################
# DECORATION
###############################
decoration {
    rounding = 5

    blur {
        enabled = true
        size    = 3
        passes  = 1
    }

    shadow {
        enabled = false
    }
}

###############################
# ANIMATIONS
###############################
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows,     1, 7,  myBezier
    animation = windowsOut,  1, 7,  default, popin 80%
    animation = border,      1, 10, default
    animation = borderangle, 1, 8,  default
    animation = fade,        1, 7,  default
    animation = workspaces,  1, 6,  default
    animation = layers,      1, 5,  default
}

###############################
# LAYOUTS
###############################
dwindle {
    pseudotile     = true
    preserve_split = true
}

master {
    new_status = master
}

###############################
# GESTURES  (0.51+ syntax)
###############################
# gesture = <fingers>, <direction>, <action>
# gesture = 3, horizontal, workspace

###############################
# LAPTOP LID
###############################
# Disable the built-in panel when the lid closes, re-enable it when the lid opens.
# bindl fires even while the session is locked.
bindl = , switch:on:Lid Switch,  exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, 1920x1080@60, 3840x0, 1"

###############################
# MISC
###############################
misc {
    force_default_wallpaper = -1    # 0 or 1 disables the anime mascot wallpapers
}

################################################################################
# KEYBINDS
################################################################################

# --- Apps / session ---
bind  = CONTROLALT, Q,        exec, $terminal
bind  = CONTROLALT, W,        killactive,
# No modo mac (waybar > mackeys) estes dois saem e dao lugar a
# ALT SUPER + Q/W: la a tecla Ctrl fisica emite Super, entao o combo fisico
# continua sendo Ctrl+Alt+Q e Ctrl+Alt+W.
# SHIFT obrigatorio: no modo mac (waybar > mackeys) a tecla Ctrl fisica emite
# Super, entao um $mainMod+M sem SHIFT seria disparado por Ctrl+M.
# bind  = $mainMod SHIFT, M,   exit,  # desativado: evitava logout acidental
bind  = $mainMod,   E,        exec, $fileManager
bind  = $mainMod,   G,        exec, $browser
# No modo mac (waybar > mackeys) o script move este bind para CTRL+L, mantendo
# o bloqueio em Super+L fisico mesmo apos a troca Ctrl <-> Super.
bind  = $mainMod,   L,        exec, $lock
bind  = $mainMod,   ESCAPE,   exec, nwg-bar
bind  = $mainMod,   B,        exec, blueman-manager

# painel de midia (dynamic island expandida)
windowrule {
    name = player-panel

    match:class = ^(dev\.local\.playerpanel)$

    float       = true
    border_size = 0
    no_blur     = true

    # A posicao exata vem do player-panel-toggle.sh: o campo "move" do
    # windowrule nao aceita aritmetica com porcentagem nesta versao.
    # Sem animacao do compositor: quem anima e o proprio painel, crescendo
    # do tamanho da ilha. Duas animacoes ao mesmo tempo brigariam.
    no_anim = true
    no_shadow  = true
    rounding   = 28
}

bindr = $mainMod,   SUPER_L,  exec, $menu
bind  = $mainMod,   V,        exec, vicinae cmd launch clipboard:history
# ALT nao sofre o swap do modo mac, entao este bind fica fora do mackeys.sh.
# Super+W ficou livre de proposito: no modo mac a tecla Super emite Ctrl e o
# navegador precisa receber Ctrl+W para fechar a aba.
bind  = ALT,        W,        exec, $scripts/wallpaper   # grade de thumbnails no rofi

# Old swaylock bind, superseded by hyprlock above
# bind = $mainMod, L, exec, swaylock --clock --screenshots --effect-blur 7x5 --indicator --indicator-radius 100 --indicator-thickness 7 --effect-vignette 0.5:0.5 --ring-color bb00cc --key-hl-color 880033 --line-color 00000000 --inside-color 00000088 --separator-color 00000000 --fade-in 0.7

# --- Window management ---
bind = $mainMod, P,     pseudo,       # dwindle
bind = ALT,      SPACE, fullscreen, 1 # maximize (fake fullscreen)
bind = ALT,      J,     cyclenext,
bind = ALT,      H,     resizeactive, -40 0
bind = ALT,      L,     resizeactive, 40 0

# --- Workspaces ---
bind = ALT, 1, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALT, 4, workspace, 4
bind = ALT, 5, workspace, 5
bind = ALT, 6, workspace, 6

bind = ALT SHIFT, 1, movetoworkspacesilent, 1
bind = ALT SHIFT, 2, movetoworkspacesilent, 2
bind = ALT SHIFT, 3, movetoworkspacesilent, 3
bind = ALT SHIFT, 4, movetoworkspacesilent, 4
bind = ALT SHIFT, 5, movetoworkspacesilent, 5
bind = ALT SHIFT, 6, movetoworkspacesilent, 6

# --- Keyboard layout ---
# "all" hits every keyboard instead of one hardcoded device.
bind = $mainMod SHIFT, SPACE, exec, hyprctl switchxkblayout all next

# --- Launcher (estilo Spotlight) ---
# No modo mac (waybar > mackeys) a tecla Super fisica emite Ctrl, entao o script
# troca este bind por CTRL,SPACE para o combo continuar na mesma tecla fisica.
bind = $mainMod, SPACE, exec, $menu

# --- Abas do navegador (estilo macOS: Cmd+1..9) ---
# O Firefox ja escuta Ctrl+1..8 para ir direto a uma aba, e Ctrl+9 para a
# ultima. sendshortcut reenvia o combo para a janela em foco, entao a mesma
# tecla Super serve nos dois modos de teclado.
# code:10..18 = teclas fisicas 1..9. O keysym nu ("1") nao chega ao Firefox;
# so o keycode funciona.
# No modo mac estes binds saem: la a tecla Super ja emite Ctrl, entao o
# Firefox recebe Ctrl+N nativo e um bind extra injetaria o combo duas vezes.
bind = $mainMod, 1, sendshortcut, CTRL, code:10, activewindow
bind = $mainMod, 2, sendshortcut, CTRL, code:11, activewindow
bind = $mainMod, 3, sendshortcut, CTRL, code:12, activewindow
bind = $mainMod, 4, sendshortcut, CTRL, code:13, activewindow
bind = $mainMod, 5, sendshortcut, CTRL, code:14, activewindow
bind = $mainMod, 6, sendshortcut, CTRL, code:15, activewindow
bind = $mainMod, 7, sendshortcut, CTRL, code:16, activewindow
bind = $mainMod, 8, sendshortcut, CTRL, code:17, activewindow
bind = $mainMod, 9, sendshortcut, CTRL, code:18, activewindow

# --- Screenshot ---
# Area selection -> clipboard + ~/Pictures/Screenshots
bind = $mainMod SHIFT, S, exec, $scripts/screenshot-area
# Full screen -> clipboard + ~/Pictures/Screenshots
bind = , Print, exec, mkdir -p ~/Pictures/Screenshots && grim - | tee ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy

# --- Media / hardware keys ---
bindel = , XF86AudioRaiseVolume,  exec, $scripts/volume --inc
bindel = , XF86AudioLowerVolume,  exec, $scripts/volume --dec
bindl  = , XF86AudioMute,         exec, $scripts/volume --toggle
bindl  = , XF86AudioMicMute,      exec, $scripts/volume --toggle-mic
bindel = , XF86MonBrightnessUp,   exec, $scripts/backlight --inc
bindel = , XF86MonBrightnessDown, exec, $scripts/backlight --dec

bind = $mainMod, F2, exec, $scripts/kbbacklight --dec
bind = $mainMod, F3, exec, $scripts/kbbacklight --inc

# --- Controle de midia (playerctl, todos os players MPRIS) ---
# FN nao chega ao compositor: FN+F10/F11/F12 emitem estes keysyms diretamente.
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioStop,  exec, playerctl stop

# A tecla FU deste teclado emite o keysym Menu (keycode 135) e fica segurada.
# Menu nao e um modificador, entao o combo vira um submap ativo enquanto FN esta pressionada.
# O submap "media" fica no fim do arquivo.
bind = , Menu, submap, media

################################################################################
# WINDOW RULES  (0.53 block syntax; `windowrule = rule,match` is gone)
################################################################################
# Hide xwaylandvideobridge helper window
windowrule {
    name = xwaylandvideobridge

    match:class = ^(xwaylandvideobridge)$

    opacity          = 0.0 override
    no_anim          = true
    no_initial_focus = true
    no_blur          = true
    max_size         = 1 1
}

################################################################################
# SUBMAP: media  (ativo enquanto a tecla FN/Menu esta pressionada)
################################################################################
submap = media
bind  = , F10,  exec, playerctl previous
bind  = , F11,  exec, playerctl play-pause
bind  = , F12,  exec, playerctl next
bindel = , Up,    exec, $scripts/volume --inc
bindel = , Down,  exec, $scripts/volume --dec

# Saidas do submap. O release de Menu as vezes nao chega ao compositor
# (troca de foco, key repeat), e sem uma saida extra o teclado fica preso
# no submap, onde so F10/F11/F12 respondem.
bindr = , Menu,     submap, reset   # caminho normal: soltar FN
bind  = , ESCAPE,   submap, reset   # saida manual
bind  = , catchall, submap, reset   # qualquer outra tecla sai do submap
submap = reset
