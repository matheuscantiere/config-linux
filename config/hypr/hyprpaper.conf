# hyprpaper — wallpaper daemon
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
# swww is not packaged for Ubuntu 26.04, so hyprpaper handles wallpapers here.
#
# Paths must be absolute or start with ~. Do not use $HOME: hyprlang reads $NAME
# as a config-local variable, so $HOME stays literal and the file is never found.

preload = /home/mcantiere/.config/hypr/wallpaper.png

# Empty monitor field applies to every output, including ones that appear later.
wallpaper = ,/home/mcantiere/.config/hypr/wallpaper.png

splash = false
ipc    = on
