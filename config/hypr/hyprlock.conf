################################################################################
#  hyprlock — adapted from github/config-linux/hyprlock.conf
#  Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
################################################################################

$font      = Ubuntu Sans
$fontMono  = JetBrainsMono Nerd Font
$text      = rgba(216, 222, 233, 0.70)

###############################
# BACKGROUND
###############################
background {
    monitor =

    path  = $HOME/.config/hypr/wallpaper.png
    color = rgba(17, 17, 27, 1.0)   # fallback if the image is missing

    blur_passes       = 1
    contrast          = 0.8916
    brightness        = 0.8172
    vibrancy          = 0.1696
    vibrancy_darkness = 0.0
}

###############################
# GENERAL
###############################
general {
    no_fade_in          = false
    grace               = 0
    disable_loading_bar = false
    hide_cursor         = true
    ignore_empty_input  = true
}

###############################
# AUTH
###############################
auth {
    fingerprint {
        enabled = false
    }
}

###############################
# PROFILE PHOTO
###############################
# No avatar image on this machine. Put one at the path below and uncomment.
# image {
