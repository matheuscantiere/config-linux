###############################
# DAY, MONTH DATE
###############################
label {
    monitor     =
    text        = cmd[update:1000] date +"%A, %B %d"
    color       = $text
    font_size   = 25
    font_family = $font
    position    = 0, 350
    halign      = center
    valign      = center
}

###############################
# TIME
###############################
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    color       = $text
    font_size   = 120
    font_family = $font
    position    = 0, 250
    halign      = center
    valign      = center
}

###############################
# USER
###############################
label {
    monitor     =
    text        =   $USER
    color       = rgba(216, 222, 233, 0.80)
    font_size   = 18
    font_family = $font
    position    = 0, -130
    halign      = center
    valign      = center
}

###############################
# INPUT FIELD
###############################
input-field {
    monitor           =
    size              = 300, 60
    outline_thickness = 2
    dots_size         = 0.2     # scale of input-field height, 0.2 - 0.8
    dots_spacing      = 0.2     # scale of dots' absolute size, 0.0 - 1.0
    dots_center       = true

    outer_color  = rgba(0, 0, 0, 0)
    inner_color  = rgba(255, 255, 255, 0.1)
    font_color   = rgb(200, 200, 200)
    check_color  = rgba(34, 129, 253, 1.0)
    fail_color   = rgba(204, 51, 68, 1.0)

    fade_on_empty    = false
    font_family      = $font
    placeholder_text = <span foreground="##ffffff99">Enter Pass</span>
    fail_text        = <i>$FAIL <b>($ATTEMPTS)</b></i>
    hide_input       = false

    position = 0, -210
    halign   = center
    valign   = center
}

###############################
# CURRENT SONG
###############################
label {
    monitor     =
    text        = cmd[update:1000] $HOME/.config/hypr/scripts/songdetail.sh
    color       = rgba(255, 255, 255, 0.6)
    font_size   = 18
    font_family = $fontMono
    position    = 0, 50
    halign      = center
    valign      = bottom
}
